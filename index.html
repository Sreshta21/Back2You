<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Back2You</title>
  <!-- <link rel="stylesheet" href="styles.css"> -->
  <style>
    /* General Page Styling */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url(bg1.jpg) no-repeat center center/cover;
      font-family: Arial, sans-serif;
    }

    /* Dark Overlay for Better Visibility */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
    }

    /* Login Container */
    .login-container {
      position: relative;
      z-index: 2;
      width: 350px;
      padding: 2rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    /* Heading */
    .login-container h2 {
      margin-bottom: 20px;
      font-weight: bold;
    }

    /* Input Fields */
    .login-container input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    /* Error Message */
    .error-message {
      color: red;
      font-size: 0.9rem;
      display: none;
    }

    /* Login Button */
    .login-container button {
      width: 100%;
      padding: 10px;
      background-color: #343a40;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s ease-in-out;
    }

    .login-container button:hover {
      background-color: #495057;
    }

  </style>
</head>
<body>

  <div class="overlay"></div>

  <div class="login-container">
  
    <h2>Community Login</h2>
    <input type="text" id="communityName" placeholder="Community Name" required>
    <input type="password" id="loginPassword" placeholder="Community Password" required>
    <button id="loginBtn">Login</button>
    

  </div>
  

  <!--FireBase code-->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
  
    const firebaseConfig = {
      apiKey: "AIzaSyBENr6BubSjysGUquwOkzBnNNU3z-4K9N4",
      authDomain: "back2you-619b1.firebaseapp.com",
      projectId: "back2you-619b1",
      storageBucket: "back2you-619b1.firebasestorage.app",
      messagingSenderId: "589502176156",
      appId: "1:589502176156:web:137e8aa7e9160b0f4ac659"
    };
  
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
  
  
    // Log In
document.getElementById("loginBtn").addEventListener("click", () => {
  const rawCommunityName = document.getElementById("communityName").value;
  const password = document.getElementById("loginPassword").value;

  // Convert community name to a valid email (custom logic)
  const email = rawCommunityName.toLowerCase() + "@back2you.com";

  signInWithEmailAndPassword(auth, email, password)
    .then((userCredential) => {
      alert("Login successful ✅");
      window.location.href = "home.html";
    })
    .catch((error) => {
      alert("Login failed ❌: " + error.message);
    });
});

  </script>
  
</body>
</html>
